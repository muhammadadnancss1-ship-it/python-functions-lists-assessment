<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1510" viewBox="0 0 1000 1510" role="img" aria-labelledby="title desc">
<title id='title'>Electricity bill program flow</title><desc id='desc'>Validate household count and units, apply progressive slabs inside a for loop, accumulate revenue and count completed bills.</desc>
