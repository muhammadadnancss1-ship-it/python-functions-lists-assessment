<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
<title id='title'>Procedural module diagram for both assessment files</title><desc id='desc'>Shows real constants and main/helper function calls in the result-card and electricity-bill modules.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b57"/><stop offset="1" stop-color="#35205c"/></linearGradient></defs>
<rect width="1000" height="1010" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="28" y="31" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">UML / MODULE VIEW</text>
<text x="28" y="64" font-size="27" fill="#17233b" font-weight="700" text-anchor="start">Two independent procedural modules</text>
<text x="28" y="87" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">Arrows labelled «calls» connect main() to the helper functions it uses.</text>
<rect x="24" y="111" width="462" height="802" rx="12" fill="#ffffff" stroke="#cad5e5"/>
<rect x="24" y="111" width="462" height="54" rx="12" fill="#eff6ff" stroke="#cad5e5"/>
<text x="255" y="133" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">«module»</text>
<text x="255" y="155" font-size="19" fill="#17233b" font-weight="700" text-anchor="middle">result_card_generator.py</text>
<rect x="514" y="111" width="462" height="802" rx="12" fill="#ffffff" stroke="#cad5e5"/>
<rect x="514" y="111" width="462" height="54" rx="12" fill="#eff6ff" stroke="#cad5e5"/>
<text x="745" y="133" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">«module»</text>
<text x="745" y="155" font-size="19" fill="#17233b" font-weight="700" text-anchor="middle">smart_electricity_bill.py</text>
<text x="46" y="195" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">CONSTANTS</text>
<text x="46" y="220" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">SUBJECTS; MIN_MARKS = 0; MAX_MARKS = 100</text>
<text x="46" y="244" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">MAX_TOTAL = 500; SUBJECT_PASS_MARK = 40</text>
<text x="46" y="268" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">GRADE_A_PLUS = 90; GRADE_A = 80; GRADE_B = 70</text>
<text x="46" y="292" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">GRADE_C = 60; GRADE_D = 50</text>
<text x="46" y="316" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">MAX_INTEGER_DIGITS = 18</text>
<rect x="60.0" y="346.0" width="390" height="116" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="255" y="379" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">main()</text>
<text x="255" y="399" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Read details and five marks</text>
<text x="255" y="419" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Calculate grade; enforce subject rule</text>
<text x="255" y="439" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Print result card</text>
<rect x="60" y="542" width="390" height="218" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="80" y="571" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">HELPER FUNCTIONS</text>
<text x="80" y="606" font-size="15" fill="#17233b" font-weight="400" text-anchor="start">format_name(name)</text>
<text x="80" y="644" font-size="15" fill="#17233b" font-weight="400" text-anchor="start">get_valid_marks(subject)</text>
<text x="80" y="682" font-size="15" fill="#17233b" font-weight="400" text-anchor="start">calculate_percentage(total, max_total)</text>
<text x="80" y="720" font-size="15" fill="#17233b" font-weight="400" text-anchor="start">get_grade(percentage)</text>
<path d="M 255 462 L 255 542" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="273" y="509" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">«calls»</text>
<text x="255" y="806" font-size="12" fill="#57657a" font-weight="400" text-anchor="middle">Local marks list uses append(), sum() and min().</text>
<text x="255" y="830" font-size="12" fill="#57657a" font-weight="400" text-anchor="middle">The grade helper uses percentage only;</text>
<text x="255" y="854" font-size="12" fill="#57657a" font-weight="400" text-anchor="middle">main() applies the below-40 override.</text>
<text x="536" y="195" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">CONSTANTS</text>
<text x="536" y="220" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">FIRST_SLAB_LIMIT = 100; SECOND_SLAB_LIMIT = 200</text>
<text x="536" y="244" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">FIRST_RATE = 10; SECOND_RATE = 15</text>
<text x="536" y="268" font-size="12" fill="#17233b" font-weight="400" text-anchor="start">THIRD_RATE = 20; MAX_INTEGER_DIGITS = 18</text>
<rect x="550.0" y="346.0" width="390" height="154" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="745" y="388" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">main()</text>
<text x="745" y="408" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">for household in range(1, households + 1)</text>
<text x="745" y="428" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">if / elif / else slab calculations</text>
<text x="745" y="448" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">total_revenue and processed_households</text>
<text x="745" y="468" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">Print bills and final report</text>
<rect x="550.0" y="592.0" width="390" height="82" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="745" y="628" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">get_valid_integer(prompt, minimum=0)</text>
<text x="745" y="648" font-size="13" fill="#17233b" font-weight="500" text-anchor="middle">Retry until numeric rules pass</text>
<path d="M 745 500 L 745 592" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="763" y="552" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">«calls»</text>
<text x="745" y="756" font-size="13" fill="#57657a" font-weight="400" text-anchor="middle">Minimum is 1 for household count,</text>
<text x="745" y="782" font-size="13" fill="#57657a" font-weight="400" text-anchor="middle">0 for units consumed.</text>
<text x="745" y="808" font-size="13" fill="#57657a" font-weight="400" text-anchor="middle">Integer-only bills and revenue;</text>
<text x="745" y="834" font-size="13" fill="#57657a" font-weight="400" text-anchor="middle">fictional practice rates.</text>
<text x="500" y="953" font-size="14" fill="#17233b" font-weight="600" text-anchor="middle">Both files use if __name__ == &quot;__main__&quot;: main().</text>
<text x="500" y="980" font-size="12" fill="#57657a" font-weight="400" text-anchor="middle">Importing either file is silent; there are no application classes or saved data files.</text>
</g>
</svg>
